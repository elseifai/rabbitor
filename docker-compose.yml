# Rabbit — production-oriented Docker Compose
#
# Infrastructure only (Postgres + Redis):
#   pnpm docker:up
#
# Full stack (migrate + API + Web):
#   cp .env.docker.example .env.docker
#   pnpm docker:deploy
#
# API is exposed on host port 5000. Postgres on 5432, Redis on 6379.

services:
  postgres:
    image: postgres:15-alpine
    container_name: rabbit-postgres
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rabbit}
    # Not exposed publicly — containers reach postgres via rabbit-network only.
    # Uncomment for local debugging: "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rabbit}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rabbit-network

  redis:
    image: redis:7-alpine
    container_name: rabbit-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Not exposed publicly — containers reach redis via rabbit-network only.
    # Uncomment for local debugging: "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - rabbit-network

  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    container_name: rabbit-migrate
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rabbit}:${POSTGRES_PASSWORD:-rabbit}@postgres:5432/${POSTGRES_DB:-rabbit}?schema=public
      RUN_SEED: ${RUN_SEED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - rabbit-network

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rabbit-api
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-rabbit}:${POSTGRES_PASSWORD:-rabbit}@postgres:5432/${POSTGRES_DB:-rabbit}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-rabbit-super-secret-jwt-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      ALLOW_DEV_OTP_BYPASS: ${ALLOW_DEV_OTP_BYPASS:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    networks:
      - rabbit-network

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_SOCKET_SERVER_URL: ${PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
        NEXT_PUBLIC_DEV_SANDBOX: ${NEXT_PUBLIC_DEV_SANDBOX:-false}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    container_name: rabbit-web
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-rabbit}:${POSTGRES_PASSWORD:-rabbit}@postgres:5432/${POSTGRES_DB:-rabbit}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-rabbit-super-secret-jwt-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      API_URL: http://api:5000
      SOCKET_BROADCAST_URL: http://api:5000
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
      NEXT_PUBLIC_SOCKET_SERVER_URL: ${PUBLIC_API_URL:-http://localhost:5000}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Rabbit <onboarding@resend.dev>}
      ALLOW_DEV_OTP_BYPASS: ${ALLOW_DEV_OTP_BYPASS:-false}
      NEXT_PUBLIC_DEV_SANDBOX: ${NEXT_PUBLIC_DEV_SANDBOX:-false}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rabbit-network

networks:
  rabbit-network:
    name: rabbit-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
