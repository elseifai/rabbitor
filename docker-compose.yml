services:
  postgres:
    image: postgres:16-alpine
    container_name: rabbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rabbit
      POSTGRES_PASSWORD: rabbit
      POSTGRES_DB: rabbit
    ports:
      - "5434:5432"
    volumes:
      - rabbit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbit -d rabbit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rabbit-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - rabbit_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  rabbit_pg_data:
  rabbit_redis_data:
