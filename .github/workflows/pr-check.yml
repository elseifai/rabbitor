name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  pr-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck API
        id: api-tsc
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @rabbit/api exec tsc --noEmit 2> api-tsc.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          echo "error_count=$(grep -c 'error TS' api-tsc.log || true)" >> $GITHUB_OUTPUT

      - name: Typecheck Web
        id: web-tsc
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @rabbit/web exec tsc --noEmit 2> web-tsc.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          echo "error_count=$(grep -c 'error TS' web-tsc.log || true)" >> $GITHUB_OUTPUT

      - name: Build Web
        id: web-build
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @rabbit/web build 2> web-build.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const apiErrors = Number('${{ steps.api-tsc.outputs.error_count }}');
            const webErrors = Number('${{ steps.web-tsc.outputs.error_count }}');
            const apiOk = '${{ steps.api-tsc.outputs.exit_code }}' === '0';
            const webOk = '${{ steps.web-tsc.outputs.exit_code }}' === '0';
            const buildOk = '${{ steps.web-build.outputs.exit_code }}' === '0';
            const body = [
              '## Rabbit PR Check',
              '',
              '| Check | Status | Details |',
              '| --- | --- | --- |',
              `| API TypeScript | ${apiOk ? '✅ Pass' : '❌ Fail'} | ${apiErrors} error(s) |`,
              `| Web TypeScript | ${webOk ? '✅ Pass' : '❌ Fail'} | ${webErrors} error(s) |`,
              `| Web Build | ${buildOk ? '✅ Pass' : '❌ Fail'} | \`pnpm --filter @rabbit/web build\` |`,
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
