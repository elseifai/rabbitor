# Rabbit — nginx reverse proxy for production VPS
#
# Install on Ubuntu:
#   sudo cp deploy/nginx/rabbitor.conf /etc/nginx/sites-available/rabbitor.conf
#   sudo ln -sf /etc/nginx/sites-available/rabbitor.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rabbitor.elseif.ai

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream rabbit_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream rabbit_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name rabbitor.elseif.ai;

    client_max_body_size 25m;

    # Backend REST API (mobile app + direct API clients)
    location /api/v1/ {
        proxy_pass http://rabbit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.IO (live order tracking, merchant/rider rooms)
    location /socket.io/ {
        proxy_pass http://rabbit_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Next.js website + BFF routes (/api/auth, /api/orders, …)
    location / {
        proxy_pass http://rabbit_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
